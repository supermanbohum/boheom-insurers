<style>
/* Layout: one-column phone-first app. Sticky blue header, scrolling list, fixed bottom tab bar. Numbers set in mono for scan-and-dial. */
:root{
  --bg:#f3f5f9; --card:#ffffff; --fg:#141a26; --mute:#6b7384; --line:#e2e6ee;
  --brand:#1746c9; --brand-fg:#ffffff; --brand-soft:#e7edfd;
  --ok:#0e8f5e; --ok-fg:#ffffff; --warn:#b45309; --warn-soft:#fdf1dc;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1420; --card:#1a2131; --fg:#eef1f7; --mute:#97a0b3; --line:#2a3344;
  --brand:#5b86f5; --brand-fg:#0b1222; --brand-soft:#1f2c4d; --ok:#2fbf84; --ok-fg:#07160f; --warn:#f0b35b; --warn-soft:#3a2d16; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#1a2131; --fg:#eef1f7; --mute:#97a0b3; --line:#2a3344;
  --brand:#5b86f5; --brand-fg:#0b1222; --brand-soft:#1f2c4d; --ok:#2fbf84; --ok-fg:#07160f; --warn:#f0b35b; --warn-soft:#3a2d16; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.view{display:none;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.view.on{display:block}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg);padding-block:14px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr h1{font-size:19px;font-weight:900;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hdr p{margin:2px 0 0;font-size:12px;opacity:.85}
.hdr .back{display:inline-block;font-size:13px;opacity:.9;margin-bottom:4px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 14px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:500}
.chip.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0;text-align:left;width:100%}
.lg{flex:0 0 42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;letter-spacing:-.02em}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:14.5px;font-weight:700}
.card small{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{flex:0 0 auto;font-size:18px;color:var(--mute);padding:4px}
.card .st.on{color:#f5a623}
.empty{text-align:center;color:var(--mute);padding:40px 0;font-size:13px}
.sec{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 8px}
/* detail */
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero .lg{flex-basis:52px;height:52px;font-size:14px}
.hero b{display:block;font-size:17px;font-weight:900}
.hero small{display:block;color:var(--mute);font-size:11.5px;word-break:break-all}
.hero .st{margin-left:auto;font-size:24px;color:var(--mute)}
.hero .st.on{color:#f5a623}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile .t{font-size:11px;color:var(--mute)}
.tile .v{font-size:15px;font-weight:700;margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;word-break:break-all}
.tile.p{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}.tile.p .t{color:inherit;opacity:.8}.tile.p .v{font-family:var(--font)}
.tile.g{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}.tile.g .t{color:inherit;opacity:.85}.tile.g .v{font-family:var(--font)}
.tile.dis{opacity:.5}
.tile .act{display:flex;gap:6px;margin-top:8px}
.tile .act button{font-size:11px;padding:5px 9px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;min-width:0}
.row .r{margin-left:auto;font-size:12px;color:var(--brand);font-weight:700;flex:0 0 auto}
.row .bd{font-size:10px;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:6px;font-weight:600}
.rows{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--mute);margin-top:8px;word-break:break-all}
/* tools */
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.tool b{display:block;font-size:13.5px;margin-bottom:8px}
.tool .ch{display:flex;flex-wrap:wrap;gap:6px}
.tool .ch a{font-size:12px;padding:7px 11px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-weight:500}
.tool.hl{background:var(--brand-soft);border-color:transparent}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--brand);display:flex;gap:6px;
  padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav button{flex:1;padding:9px 0;font-size:13.5px;font-weight:700;color:var(--brand-fg);opacity:.75;border-radius:10px;background:rgba(255,255,255,.14)}
.nav button.on{opacity:1;background:var(--card);color:var(--brand)}
.view{padding-bottom:24px}
.hdr{position:static}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* 광고 레일: PC에서만 양옆 10칸 */
.shell{display:grid;grid-template-columns:1fr;max-width:560px;margin:0 auto;gap:0}
.rail{display:none}
.ad{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:230/120;min-width:0}
.ad img{width:100%;height:100%;object-fit:cover;display:block}
.ad.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mute);font-size:11px;border-style:dashed;background:transparent}
.ad.empty b{font-size:13px;color:var(--fg);opacity:.5}
.adstrip{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#ads-top{padding-top:12px}#ads-bottom{padding-block:8px 24px}
@media (min-width:1080px){
  .shell{max-width:1120px;grid-template-columns:230px minmax(0,560px) 230px;gap:24px;align-items:start;padding-inline:16px}
  .rail{display:grid;grid-template-columns:1fr;gap:10px;padding-top:12px;align-content:start}
}
@media (min-width:1560px){
  .shell{max-width:1600px;grid-template-columns:480px minmax(0,560px) 480px;gap:20px}
  .rail{grid-template-columns:1fr 1fr}
}
</style>

      <a class="row" href="${i.tm}" target="_blank" rel="noopener">약관 / 상품공시 확인<span class="r">열기 ›</span></a>
      ${dental}${extra}
    </div>
    <div class="sec">자주 쓰는 동작</div>
    <div class="rows">
      <button class="row" data-copy="${i.fx}">📠 청구팩스 번호 복사<span class="r">복사</span></button>
      <button class="row" data-copy="${i.n} 보험금 청구서: ${i.cf}">💬 청구서 링크 복사 (카톡으로 고객에게)<span class="r">복사</span></button>
    </div>`;
}
function renderTools(){
  const cats = [...new Set(TOOLS.map(t=>t.c))];
  const icon = {"자동차보험":"🚗","자녀보험":"👶","화재보험":"🔥","실손보험":"🏥","승강기보험":"🛗","고객 보험 조회":"🔎","상담 자료 (질병·간병)":"🩺","세금·행정":"🏛️","보험교육":"📚","GA 필수 링크":"🏢","공통 자료":"📁","설계 비교·계산 (지에이월드, 로그인)":"🧮","문서·이미지 도구 (온라인)":"🛠️","디지털·온라인 보험사":"📱","설계사 사이트 모음":"🌐"};
  $('#t-body').innerHTML = cats.map(c=>`<div class="tool ${c==='공통 자료'?'hl':''}"><b>${icon[c]||'🔗'} ${c}</b><div class="ch">${TOOLS.filter(t=>t.c===c).map(t=>`<a href="${t.u}" target="_blank" rel="noopener">${t.t}</a>`).join('')}</div></div>`).join('');
}
function go(h){ location.hash = h; }
function render(){
  const h = (location.hash||'#list').slice(1);
  let v = 'list';
  if(h.startsWith('i-')) v='detail'; else if(h==='tools') v='tools'; else if(h==='fav'){ v='list'; }
  favOnly = (h==='fav');
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===(v==='detail'?'list':v)));
  if(v==='list'){ $('#h-title').textContent='보험사 바로가기'; $('#h-sub').textContent='전산 · 고객센터 · 청구팩스 · 약관 · 청구서 한 번에'; }
  if(v==='tools'){ $('#h-title').textContent='업무 도구'; $('#h-sub').textContent='설계사가 매일 쓰는 외부 링크 '+TOOLS.length+'개'; }
  if(v==='list'){ renderChips(); renderList(); }
  if(v==='detail') renderDetail(Number(h.slice(2)));
  if(v==='tools') renderTools();
  if(v!=='list') window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-fav]'); if(b){ e.preventDefault(); toggleFav(b.dataset.fav); return; }
  const c = e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); return; }
  const ch = e.target.closest('[data-cat]'); if(ch){ if(ch.dataset.cat==='__fav'){ go('fav'); } else { cat = ch.dataset.cat; if(favOnly) go('list'); else render(); } return; }
  const nb = e.target.closest('[data-go]'); if(nb){ go(nb.dataset.go); }
});
$('#q').addEventListener('input', e=>{ q = e.target.value.replace(/\s/g,'').toLowerCase(); renderList(); });
window.addEventListener('hashchange', render);
render();
renderAds(ADS_DEFAULT);
fetch('ads.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{ if(j) renderAds(j); }).catch(()=>{});
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
